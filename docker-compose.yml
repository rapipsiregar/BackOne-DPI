version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: backone_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=backone_dpi

  backend:
    build: 
      context: ./backend
    container_name: backone_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/backone_dpi
      - BACKEND_PORT=3001
    env_file:
      - .env.local
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
    container_name: backone_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    env_file:
      - .env.local
    depends_on:
      - backend

volumes:
  mongodb_data:
